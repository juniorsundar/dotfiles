# Finders — config-driven fuzzy pickers.

[finder.git-files]
label = "Git: Tracked Files"
placeholder = "Open a tracked file…"
source = { type = "command", command = "git", args = [
  "ls-files",
  "--cached",
  "--others",
  "--exclude-standard",
] }
outcome = { type = "open_path" }
preview = { type = "path" }

[finder.git-modified]
label = "Git: Modified Files"
placeholder = "Open a changed file…"
source = { type = "command", command = "git", args = [
  "diff",
  "--name-only",
  "HEAD",
] }
outcome = { type = "open_path" }
preview = { type = "path" }

[finder.untracked]
label = "Git: Untracked Files"
placeholder = "Open an untracked file…"
source = { type = "command", command = "git", args = [
  "ls-files",
  "--others",
  "--exclude-standard",
] }
outcome = { type = "open_path" }
preview = { type = "path" }

[finder.zed-config]
label = "Zed Config"
placeholder = "Open a Zed config file…"
source = { type = "command", command = "sh", args = [
  "-c",
  "find ~/.config/zed -maxdepth 1 \\( -type f -o -type l \\)",
] }
outcome = { type = "open_path" }
preview = { type = "path" }

[finder.zed-links]
label = "Zed Links"
placeholder = "Open a link in the browser…"
source = { type = "command", command = "printf", args = [
  "%s\n",
  "https://zed.dev/docs",
  "https://github.com/zed-industries/zed/issues",
  "https://zed.dev/docs/key-bindings",
] }
outcome = { type = "dispatch_action", action = "zed::OpenBrowser", args = { url = "{}" } }

[finder.live-grep]
label = "Live Grep"
placeholder = "Search project contents…"
source = { type = "query", command = "rg", args = [
  "--vimgrep",
  "{query}",
] }
delimiter = ":"
outcome = { type = "open_path_at_position", path = "{1}:{2}:{3}" }
preview = { type = "path" }
